[project]
name = "anthropic-oauth-agent"
version = "0.1.0"
description = "Watches local browsers for the Claude Code OAuth login and clicks through it with a fixed Google account."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "uiautomation>=2.0.29",
]

[project.scripts]
anthropic-oauth-agent = "anthropic_oauth_agent.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anthropic_oauth_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
